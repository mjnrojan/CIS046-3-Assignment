<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Ladder – Banana Puzzle Arena</title>
    <link rel="stylesheet" href="game.css">
</head>
<!-- mode-classic hides .rush-only and .battle-only via game.css -->
<body class="mode-classic">

    <!-- ── TOP HEADER ─────────────────────────────────────────── -->
    <header class="game-header">
        <div class="header-left">
            <a href="arena.html" class="btn-back" onclick="if(typeof playSound==='function')playSound('click')">⬅ Arena</a>
            <!-- Classic: node indicator -->
            <span class="node-label classic-only" id="header-node-indicator">Node #1</span>
            <!-- Rush: mode label (hidden in classic) -->
            <span class="mode-label rush-only" id="rush-mode-label">⚡ Rush</span>
            <!-- Battle: mode label (hidden in classic) -->
            <span class="mode-label battle-only">⚔️ Puzzle Battle</span>
        </div>
        <div class="header-right">
            <!-- Classic: points pill -->
            <div class="points-pill classic-only">
                <span>🔥</span>
                <span id="header-ladder-points">0</span>
                <span class="pts-label">pts</span>
            </div>
            <!-- Rush: timer + high score (hidden in classic) -->
            <span class="highscore-chip rush-only">Best: <span id="header-high-score">0</span></span>
            <span class="timer-badge rush-only" id="rush-timer">05:00</span>
            <!-- Battle: timer (hidden in classic) -->
            <span class="timer-badge battle-only" id="battle-timer">03:00</span>
            <!-- Mute button (all modes) -->
            <button class="btn-mute btn-toggle-mute" title="Toggle sound">🔊</button>
        </div>
    </header>

    <!-- ── HUD STRIP ──────────────────────────────────────────── -->
    <div class="game-hud">
        <!-- Rush: solve count + strikes (hidden in classic) -->
        <div class="hud-chip rush-only">
            ✓ Solved: <span class="chip-val" id="rush-solve-count">0</span>
        </div>
        <div class="strike-row rush-only">
            <div class="strike-box" id="strike-1">1</div>
            <div class="strike-box" id="strike-2">2</div>
            <div class="strike-box" id="strike-3">3</div>
        </div>

        <!-- Battle: player vs opponent scores + race bar (hidden in classic) -->
        <div class="hud-chip battle-only">
            <span style="color:var(--green)">You: <strong id="player-score">0</strong></span>
        </div>
        <div class="race-bar-wrap battle-only">
            <div class="race-bar-player"   id="race-bar-player"></div>
            <div class="race-bar-opponent" id="race-bar-opponent"></div>
        </div>
        <div class="hud-chip battle-only">
            <span style="color:var(--red)" id="opponent-name">Opponent</span>: <strong id="opponent-score">0</strong>
        </div>
    </div>

    <!-- ── PUZZLE STAGE ───────────────────────────────────────── -->
    <main class="puzzle-stage">

        <!-- Battle: player vs opponent name plates (hidden in classic/rush) -->
        <div class="battle-players battle-only">
            <div class="player-side">
                <span class="player-name" id="player-username">You</span>
                <span class="rating-badge" id="player-rating-badge">500 Elo</span>
                <div class="strike-row">
                    <div class="strike-box" id="p-strike-1">1</div>
                    <div class="strike-box" id="p-strike-2">2</div>
                    <div class="strike-box" id="p-strike-3">3</div>
                </div>
            </div>
            <span class="vs-label">VS</span>
            <div class="player-side right">
                <span class="player-name" id="opponent-username-plate">Opponent</span>
                <span class="rating-badge" id="opponent-rating-badge">500 Elo</span>
                <div class="strike-row">
                    <div class="strike-box" id="o-strike-1">1</div>
                    <div class="strike-box" id="o-strike-2">2</div>
                    <div class="strike-box" id="o-strike-3">3</div>
                </div>
            </div>
        </div>

        <!-- Puzzle image card — flex:1 so it takes all remaining height -->
        <div class="puzzle-card">
            <div class="puzzle-loader" id="ladder-puzzle-loader">🍌 Loading…</div>
            <img id="ladder-puzzle-img" class="puzzle-img" alt="Banana puzzle" style="display:none;">
        </div>

        <!-- Guess input + submit -->
        <form id="ladder-form" class="input-row" autocomplete="off">
            <input
                type="text"
                id="ladder-guess-input"
                class="input-digit"
                maxlength="1"
                pattern="[0-9]"
                placeholder="?"
                required
                autofocus
            >
            <button type="submit" id="btn-ladder-submit" class="btn-submit">Submit Answer</button>
        </form>

        <!-- Status feedback line -->
        <p id="ladder-status-msg" class="status-line" role="status"></p>
    </main>

    <!-- ── ENCOURAGEMENT TOAST ────────────────────────────────── -->
    <div id="encouragement-toast" class="toast-banner" hidden>
        <span class="toast-label" id="toast-label">💬 Keep it up!</span>
        <span id="toast-message">You are doing great!</span>
        <span class="toast-fact" id="toast-fact" hidden></span>
    </div>

    <!-- ── SCRIPTS ────────────────────────────────────────────── -->
    <script src="js/sound.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dev-reload.js"></script>
    <script src="js/classic.js"></script>
</body>
</html>
