<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Rush – Banana Puzzle Arena</title>
    <link rel="stylesheet" href="game.css">
</head>
<!-- mode-rush hides .classic-only and .battle-only via game.css -->
<body class="mode-rush">

    <!-- ── TOP HEADER ─────────────────────────────────────────── -->
    <header class="game-header">
        <div class="header-left">
            <a href="arena.html" class="btn-back" onclick="if(typeof playSound==='function')playSound('click')">⬅ Arena</a>
            <span class="mode-label rush-only" id="rush-mode-label">⚡ Rush</span>
        </div>
        <div class="header-right">
            <span class="highscore-chip rush-only">Best: <span id="header-high-score">0</span></span>
            <span class="timer-badge rush-only" id="rush-timer">05:00</span>
            <button class="btn-mute btn-toggle-mute" title="Toggle sound">🔊</button>
        </div>
    </header>

    <!-- ── HUD STRIP ──────────────────────────────────────────── -->
    <div class="game-hud">
        <div class="hud-chip">
            ✓ Solved: <span class="chip-val" id="rush-solve-count">0</span>
        </div>
        <div class="strike-row">
            <div class="strike-box" id="strike-1">✕</div>
            <div class="strike-box" id="strike-2">✕</div>
            <div class="strike-box" id="strike-3">✕</div>
        </div>
    </div>

    <!-- ── PUZZLE STAGE ───────────────────────────────────────── -->
    <main class="puzzle-stage">
        <!-- Puzzle image card -->
        <div class="puzzle-card">
            <img id="rush-puzzle-img" class="puzzle-img" alt="Puzzle Rush challenge">
        </div>

        <!-- Guess input + submit -->
        <form id="rush-form" class="input-row" autocomplete="off">
            <input
                type="text"
                id="rush-input"
                class="input-digit"
                maxlength="1"
                pattern="[0-9]"
                placeholder="?"
                required
                autofocus
            >
            <button type="submit" id="btn-rush-submit" class="btn-submit">Submit</button>
        </form>

        <!-- Feedback line -->
        <p id="rush-feedback" class="status-line" role="status"></p>
    </main>

    <!-- ── RUSH SUMMARY MODAL ─────────────────────────────────── -->
    <div id="rush-summary-modal" class="modal-overlay" hidden role="dialog" aria-modal="true">
        <div class="modal-card">
            <div class="modal-title" style="font-size:1.5rem;">⚡ Rush Complete!</div>
            <div class="modal-score">
                Puzzles Solved<br>
                <strong id="summary-score-val">0</strong>
            </div>
            <div id="summary-high-badge" style="color:var(--green);font-weight:800;" hidden>🏆 New High Score!</div>
            <div style="display:flex;gap:0.75rem;justify-content:center;">
                <button id="btn-play-again" class="btn-modal-action">Play Again</button>
                <a href="arena.html" class="btn-modal-action secondary">Back to Arena</a>
            </div>
        </div>
    </div>

    <!-- ── ENCOURAGEMENT TOAST ────────────────────────────────── -->
    <div id="encouragement-toast" class="toast-banner" hidden>
        <span class="toast-label" id="toast-label">💬 Keep it up!</span>
        <span id="toast-message">You are doing great!</span>
        <span class="toast-fact" id="toast-fact" hidden></span>
    </div>

    <!-- ── SCRIPTS ────────────────────────────────────────────── -->
    <script src="js/sound.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dev-reload.js"></script>
    <script src="js/rush.js"></script>
</body>
</html>
