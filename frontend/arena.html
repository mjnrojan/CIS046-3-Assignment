<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banana Puzzle Arena</title>
    <style>
        /* ── Reset & Base ─────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:        #0d0d14;
            --panel:     #15151f;
            --panel2:    #1c1c2a;
            --border:    #2a2a3d;
            --green:     #6fcf5a;
            --green-glow:#6fcf5a66;
            --orange:    #f28b24;
            --blue:      #4a9eff;
            --gold:      #f5c842;
            --red:       #e05c5c;
            --muted:     #8888aa;
            --text:      #e8e8f0;
            --white:     #ffffff;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ── Top Bar ───────────────────────────────────────────────── */
        .top-bar {
            position: relative;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.4rem;
            background: rgba(13,13,20,0.92);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(8px);
            flex-shrink: 0;
        }

        .top-logo {
            font-size: 1.25rem;
            font-weight: 900;
            color: var(--white);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .top-logo span { color: var(--gold); }

        .top-center {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stat-chip {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            background: var(--panel2);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 0.3rem 0.75rem;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text);
        }

        .stat-chip .chip-label { color: var(--muted); font-weight: 400; font-size: 0.75rem; }
        .stat-chip .chip-val   { color: var(--green); }
        .stat-chip.battle .chip-val { color: var(--blue); }
        .stat-chip.ladder .chip-val { color: var(--gold); }

        .top-right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .icon-btn {
            background: var(--panel2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.15s;
            text-decoration: none;
        }

        .icon-btn:hover {
            background: var(--border);
            border-color: var(--green);
            color: var(--green);
        }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--panel2);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 0.3rem 0.9rem 0.3rem 0.5rem;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text);
        }

        .user-pill:hover { border-color: var(--green); }
        .user-avatar { font-size: 1.3rem; }

        /* ── Canvas World Map ──────────────────────────────────────── */
        #world-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* ── Bottom Action Bar ─────────────────────────────────────── */
        .action-bar {
            position: relative;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.4rem 1.5rem 1.75rem;
            gap: 0;
            flex-shrink: 0;
            background: linear-gradient(to top, rgba(13,13,20,0.98) 70%, transparent);
        }

        /* Primary PLAY button */
        .btn-play {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            background: var(--green);
            color: #0d1a09;
            font-size: 1.3rem;
            font-weight: 900;
            padding: 0.9rem 2.4rem;
            border: none;
            border-radius: 12px 0 0 12px;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: background 0.15s, transform 0.08s;
            box-shadow: 0 0 24px var(--green-glow);
        }

        .btn-play:hover  { background: #82e06d; }
        .btn-play:active { transform: scale(0.97); }

        /* Dropdown chevron button (attached to right of PLAY) */
        .btn-dropdown-toggle {
            background: #4fa843;
            color: #0d1a09;
            border: none;
            border-left: 1px solid #3d8a34;
            border-radius: 0 12px 12px 0;
            width: 46px;
            height: 100%;
            min-height: 54px;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
            box-shadow: 0 0 24px var(--green-glow);
            position: relative;
        }

        .btn-dropdown-toggle:hover { background: #5bbf4f; }

        /* Dropdown popup card */
        .mode-popup {
            position: absolute;
            bottom: calc(100% + 0.6rem);
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            min-width: 220px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            z-index: 30;
        }

        .mode-popup[hidden] { display: none !important; }

        .popup-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text);
            font-weight: 700;
            font-size: 0.95rem;
            transition: background 0.12s;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }

        .popup-item:hover { background: var(--panel2); }
        .popup-item .pi-icon { font-size: 1.3rem; }

        .popup-item .pi-sub {
            font-size: 0.75rem;
            font-weight: 400;
            color: var(--muted);
            margin-top: 1px;
        }

        .popup-item.rush  .pi-icon { filter: drop-shadow(0 0 6px #f28b24); }
        .popup-item.battle .pi-icon { filter: drop-shadow(0 0 6px #4a9eff); }

        /* ── Leaderboard Overlay (from existing tab) ──────────────── */
        .leaderboard-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .leaderboard-overlay[hidden] { display: none !important; }

        .leaderboard-panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.5rem;
            width: 90%;
            max-width: 460px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .lb-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
        }

        .lb-title { font-size: 1.15rem; font-weight: 800; color: var(--white); }

        .btn-close-lb {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 1.3rem;
            cursor: pointer;
        }

        /* ── Rush Mode Selector Modal ─────────────────────────────── */
        .rush-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        .rush-modal-overlay[hidden] { display: none !important; }

        .rush-modal {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.75rem;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .rush-modal h2 { font-size: 1.3rem; color: var(--white); margin-bottom: 0.5rem; }
        .rush-modal p  { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.25rem; }

        .rush-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .btn-option {
            background: var(--panel2);
            color: var(--white);
            border: 1px solid var(--border);
            padding: 0.9rem 0.5rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-option:hover { border-color: var(--orange); color: var(--orange); }

        .btn-close {
            background: none;
            color: var(--muted);
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        /* ── Current Node Indicator (floating HUD) ─────────────────── */
        .node-hud {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            background: rgba(13,13,20,0.88);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 0.4rem 1.1rem;
            font-size: 0.85rem;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
            backdrop-filter: blur(6px);
        }

        .node-hud strong { color: var(--gold); }
    </style>
</head>
<body>

    <!-- ── Top Navigation Bar ───────────────────────────────────── -->
    <header class="top-bar">
        <div class="top-logo">🍌 <span>Banana</span> Puzzle Arena</div>

        <!-- Live stats chips (populated by arena.js) -->
        <div class="top-center" id="stats-row">
            <div class="stat-chip rush">
                <span class="chip-label">⚡ Rush</span>
                <span class="chip-val" id="stat-rush">0</span>
            </div>
            <div class="stat-chip battle">
                <span class="chip-label">⚔️ Elo</span>
                <span class="chip-val" id="stat-battle">500</span>
            </div>
            <div class="stat-chip ladder">
                <span class="chip-label">🪜 Pts</span>
                <span class="chip-val" id="stat-ladder">0</span>
            </div>
        </div>

        <div class="top-right">
            <!-- Mute toggle -->
            <button class="icon-btn btn-toggle-mute" title="Toggle Sound">
                <span class="btn-mute-icon">🔊</span>
            </button>
            <!-- Leaderboard shortcut -->
            <button class="icon-btn" id="btn-open-lb" title="Leaderboards">🏆</button>
            <!-- Settings (links to separate page if you build one) -->
            <a href="leaderboard.html" class="icon-btn" title="Full Leaderboard Page">📊</a>
            <!-- User identity pill -->
            <div class="user-pill">
                <span class="user-avatar">🍌</span>
                <span id="profile-username">Loading...</span>
            </div>
            <button class="icon-btn" id="btn-logout" title="Log out">↩️</button>
        </div>
    </header>

    <!-- ── World Map Canvas ─────────────────────────────────────── -->
    <div style="position:relative; flex:1; overflow:hidden;">
        <canvas id="world-canvas"></canvas>

        <!-- Floating current-node indicator -->
        <div class="node-hud">
            Current Node: <strong id="card-ladder-node">Node #1</strong>
            &nbsp;•&nbsp; Battle Rating: <strong id="card-battle-rating">500 Elo</strong>
            &nbsp;•&nbsp; Rush Best: <strong id="card-rush-score">0 Solves</strong>
        </div>
    </div>

    <!-- ── Bottom Action Bar ────────────────────────────────────── -->
    <div class="action-bar">
        <!-- PLAY NOW → goes to Classic Ladder -->
        <a href="classic.html" class="btn-play" id="btn-start-ladder"
           onclick="playSound('click')">
            ▶ PLAY NOW
        </a>

        <!-- Dropdown toggle for other modes -->
        <div style="position:relative;">
            <button class="btn-dropdown-toggle" id="btn-open-modes" title="Other Modes">▾</button>

            <div class="mode-popup" id="mode-popup" hidden>
                <!-- Rush mode item — opens rush modal -->
                <button class="popup-item rush" id="btn-open-rush-modal">
                    <span class="pi-icon">⚡</span>
                    <div>
                        <div>Puzzle Rush</div>
                        <div class="pi-sub">Timed sprint — 1m / 5m / 10m / Survival</div>
                    </div>
                </button>
                <!-- Battle mode item -->
                <a href="battle.html" class="popup-item battle" id="btn-start-battle"
                   onclick="playSound('click')">
                    <span class="pi-icon">⚔️</span>
                    <div>
                        <div>1v1 Puzzle Battle</div>
                        <div class="pi-sub">Real-time Elo matchmaking duel</div>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <!-- ── Rush Mode Selector Modal ─────────────────────────────── -->
    <div id="rush-modal" class="rush-modal-overlay" hidden role="dialog" aria-modal="true">
        <div class="rush-modal">
            <h2>⚡ Choose Rush Mode</h2>
            <p>3 strikes and you are out. How many puzzles can you solve?</p>
            <div class="rush-options">
                <button class="btn-option" data-duration="60">⏱️ 1 Minute</button>
                <button class="btn-option" data-duration="300">⏱️ 5 Minutes</button>
                <button class="btn-option" data-duration="600">⏱️ 10 Minutes</button>
                <button class="btn-option" data-duration="0">💀 Survival</button>
            </div>
            <button class="btn-close" id="btn-close-rush">Cancel</button>
        </div>
    </div>

    <!-- ── Scripts ──────────────────────────────────────────────── -->
    <script src="js/sound.js"></script>
    <script src="js/dev-reload.js"></script>
    <script src="js/arena.js"></script>

    <script>
        /**
         * Draws the indie-style scrollable level-node world map on the canvas.
         * Nodes reflect the player's real ladder_node progress.
         * This runs client-side only — no server calls needed.
         */
        (function () {
            var canvas = document.getElementById('world-canvas');
            var ctx = canvas.getContext('2d');

            // Current ladder node is injected by arena.js into #card-ladder-node
            // We read it after arena.js has populated it (500ms grace period)
            var currentNode = 1;
            var totalNodes  = 10;

            // Node layout: zigzag pattern across the canvas
            function getNodePositions(w, h) {
                var positions = [];
                var cols = [0.22, 0.5, 0.78]; // x as fraction of canvas width
                for (var i = 0; i < totalNodes; i++) {
                    var row  = Math.floor(i / cols.length);
                    var col  = (row % 2 === 0) ? i % cols.length : (cols.length - 1 - i % cols.length);
                    var x    = w * cols[col];
                    var y    = h - 80 - row * (h / (totalNodes / cols.length + 0.5));
                    positions.push({ x: x, y: y, index: i + 1 });
                }
                return positions;
            }

            function drawStars(w, h) {
                // Static star field background
                var seed = 42;
                function rand() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
                ctx.fillStyle = '#ffffff';
                for (var s = 0; s < 160; s++) {
                    var sx = rand() * w;
                    var sy = rand() * h;
                    var sr = rand() * 1.4 + 0.3;
                    ctx.globalAlpha = rand() * 0.5 + 0.15;
                    ctx.beginPath();
                    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }

            function drawPath(positions) {
                if (positions.length < 2) return;
                ctx.beginPath();
                ctx.moveTo(positions[0].x, positions[0].y);
                for (var i = 1; i < positions.length; i++) {
                    // Curved bezier between nodes
                    var mx = (positions[i - 1].x + positions[i].x) / 2;
                    var my = (positions[i - 1].y + positions[i].y) / 2;
                    ctx.quadraticCurveTo(positions[i - 1].x, positions[i - 1].y, mx, my);
                }
                ctx.quadraticCurveTo(
                    positions[positions.length - 1].x,
                    positions[positions.length - 1].y,
                    positions[positions.length - 1].x,
                    positions[positions.length - 1].y
                );
                ctx.strokeStyle = '#2a2a3d';
                ctx.lineWidth   = 5;
                ctx.setLineDash([10, 8]);
                ctx.stroke();
                ctx.setLineDash([]);

                // Green completed segment
                if (currentNode > 1) {
                    ctx.beginPath();
                    ctx.moveTo(positions[0].x, positions[0].y);
                    for (var j = 1; j < Math.min(currentNode, positions.length); j++) {
                        var pmx = (positions[j - 1].x + positions[j].x) / 2;
                        var pmy = (positions[j - 1].y + positions[j].y) / 2;
                        ctx.quadraticCurveTo(positions[j - 1].x, positions[j - 1].y, pmx, pmy);
                    }
                    ctx.strokeStyle = '#3d7a32';
                    ctx.lineWidth   = 5;
                    ctx.setLineDash([10, 8]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }

            function drawNode(pos, animPulse) {
                var state = pos.index < currentNode  ? 'done'
                          : pos.index === currentNode ? 'active'
                          : 'locked';

                var radius = state === 'active' ? 30 + Math.sin(animPulse) * 4 : 26;

                // Glow for active node
                if (state === 'active') {
                    var grd = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, radius * 2.2);
                    grd.addColorStop(0, 'rgba(111,207,90,0.35)');
                    grd.addColorStop(1, 'rgba(111,207,90,0)');
                    ctx.fillStyle = grd;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, radius * 2.2, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Node circle
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
                ctx.fillStyle = state === 'done'   ? '#1e3d1a'
                              : state === 'active'  ? '#2a5c24'
                              : '#1a1a28';
                ctx.fill();
                ctx.strokeStyle = state === 'done'   ? '#3d7a32'
                                : state === 'active'  ? '#6fcf5a'
                                : '#2a2a3d';
                ctx.lineWidth   = state === 'active' ? 3 : 2;
                ctx.stroke();

                // Icon inside
                ctx.font      = (state === 'active' ? '1.4rem' : '1.1rem') + ' serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(
                    state === 'done'   ? '✓'
                  : state === 'active' ? '⭐'
                  : '🔒',
                    pos.x, pos.y
                );

                // Node number label below
                ctx.font      = '700 0.72rem system-ui';
                ctx.fillStyle = state === 'active' ? '#6fcf5a' : '#555577';
                ctx.fillText('LVL ' + pos.index, pos.x, pos.y + radius + 14);
            }

            var animFrame = 0;
            function draw() {
                canvas.width  = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
                var w = canvas.width, h = canvas.height;

                // Dark gradient sky
                var bg = ctx.createLinearGradient(0, 0, 0, h);
                bg.addColorStop(0, '#0a0a14');
                bg.addColorStop(1, '#0d1220');
                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, w, h);

                drawStars(w, h);

                // Read current node from DOM (arena.js writes it here)
                var nodeEl = document.getElementById('card-ladder-node');
                if (nodeEl) {
                    var parsed = parseInt(nodeEl.textContent.replace(/\D/g, ''), 10);
                    if (!isNaN(parsed)) currentNode = parsed;
                }

                var positions = getNodePositions(w, h);
                drawPath(positions);
                positions.forEach(function (pos) { drawNode(pos, animFrame * 0.06); });

                animFrame++;
                requestAnimationFrame(draw);
            }

            // Start render loop — resize canvas when window resizes
            window.addEventListener('resize', function () {
                canvas.width  = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
            });

            draw();
        })();

        // ── Mode Dropdown Toggle ───────────────────────────────────
        var modePopup  = document.getElementById('mode-popup');
        var toggleBtn  = document.getElementById('btn-open-modes');

        toggleBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            modePopup.hidden = !modePopup.hidden;
            playSound('click');
        });

        // Close popup when clicking outside it
        document.addEventListener('click', function () {
            if (modePopup) modePopup.hidden = true;
        });

        modePopup.addEventListener('click', function (e) {
            e.stopPropagation(); // clicks inside popup don't close it
        });

        // Rush popup item opens the rush modal (arena.js btn-open-rush-modal listener)
        document.getElementById('btn-open-rush-modal').addEventListener('click', function () {
            modePopup.hidden = true;
        });

        // Leaderboard shortcut button (simple redirect)
        document.getElementById('btn-open-lb').addEventListener('click', function () {
            playSound('click');
            window.location.href = 'leaderboard.html';
        });
    </script>
</body>
</html>
