<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Rush – Banana Puzzle Arena</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-dark: #191816;
            --bg-card: #262421;
            --accent-orange: #f28b24;
            --accent-green: #81b64c;
            --accent-red: #e74c3c;
            --border-color: #3d3a34;
            --text-light: #ffffff;
            --text-muted: #a6a39b;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .rush-wrapper {
            max-width: 640px;
            margin: 0 auto;
            padding: 1rem 1rem 3rem 1rem;
        }

        /* Top Nav Bar */
        .rush-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0.75rem 1.25rem;
            margin-bottom: 1.25rem;
        }

        .btn-back {
            background: #181715;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .btn-back:hover {
            color: #fff;
            border-color: #666;
        }

        .rush-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--accent-orange);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* HUD: Timer, Solves, Strikes */
        .rush-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
        }

        .hud-timer {
            font-size: 2rem;
            font-weight: 800;
            font-family: monospace;
            color: var(--text-light);
            letter-spacing: 1px;
        }

        .hud-timer.urgent {
            color: var(--accent-red);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .hud-solves {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--accent-green);
        }

        .hud-strikes {
            display: flex;
            gap: 0.4rem;
        }

        .strike-box {
            width: 32px;
            height: 32px;
            background: #1b1a18;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.1rem;
            color: transparent;
            transition: all 0.2s;
        }

        .strike-box.active {
            border-color: var(--accent-red);
            background: rgba(231, 76, 60, 0.2);
            color: var(--accent-red);
            transform: scale(1.1);
        }

        /* Puzzle Board */
        .puzzle-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
        }

        .puzzle-viewport {
            background: #ffffff;
            border-radius: 8px;
            padding: 0.75rem;
            display: inline-block;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
            max-width: 100%;
        }

        .puzzle-viewport img {
            max-width: 100%;
            height: auto;
            display: block;
            min-height: 200px;
        }

        .input-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .rush-input {
            width: 80px;
            height: 52px;
            font-size: 1.75rem;
            font-weight: 800;
            text-align: center;
            background: #181715;
            color: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            outline: none;
        }

        .rush-input:focus {
            border-color: var(--accent-orange);
        }

        .btn-submit {
            height: 52px;
            padding: 0 1.75rem;
            font-size: 1.1rem;
            font-weight: 800;
            background: var(--accent-orange);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-submit:hover {
            background: #e07914;
        }

        .rush-feedback {
            min-height: 1.5rem;
            font-size: 1rem;
            font-weight: 700;
        }

        .rush-feedback.correct {
            color: var(--accent-green);
        }

        .rush-feedback.wrong {
            color: var(--accent-red);
        }

        /* Game Over Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal-overlay[hidden] {
            display: none !important;
        }

        .summary-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            max-width: 420px;
            width: 90%;
            text-align: center;
        }

        .summary-score {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--accent-orange);
            margin: 0.5rem 0;
        }

        .high-score-badge {
            background: rgba(129, 182, 76, 0.2);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            padding: 0.35rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 1.5rem;
        }

        .modal-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
        }

        .btn-modal {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            text-decoration: none;
        }

        .btn-retry {
            background: var(--accent-orange);
            color: #ffffff;
        }

        .btn-arena {
            background: #181715;
            color: var(--text-light);
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <div class="rush-wrapper">
        <!-- Top Nav -->
        <header class="rush-header">
            <a href="arena.html" class="btn-back">⬅ Exit Rush</a>
            <div class="rush-title">
                <span>⚡</span>
                <span id="rush-mode-label">5-Minute Rush</span>
            </div>
            <div style="font-size: 0.9rem; color: var(--text-muted);">
                High Score: <strong id="header-high-score" style="color: #fff;">0</strong>
            </div>
        </header>

        <!-- Dynamic Game HUD -->
        <div class="rush-hud">
            <!-- Timer countdown -->
            <div class="hud-timer" id="rush-timer">05:00</div>

            <!-- Solved Counter -->
            <div class="hud-solves">
                <span>🔥</span>
                <span id="rush-solve-count">0</span>
            </div>

            <!-- Strikes Box (3 Strikes max) -->
            <div class="hud-strikes" id="rush-strikes-container">
                <div class="strike-box" id="strike-1">❌</div>
                <div class="strike-box" id="strike-2">❌</div>
                <div class="strike-box" id="strike-3">❌</div>
            </div>
        </div>

        <!-- Puzzle Playing Card -->
        <main class="puzzle-card">
            <div class="puzzle-viewport">
                <img id="rush-puzzle-img" alt="Puzzle Rush math challenge">
            </div>

            <form id="rush-form" class="input-row" autocomplete="off">
                <input 
                    type="text" 
                    id="rush-input" 
                    class="rush-input" 
                    maxlength="1" 
                    pattern="[0-9]" 
                    placeholder="?" 
                    required 
                    autofocus
                >
                <button type="submit" id="btn-rush-submit" class="btn-submit">Submit</button>
            </form>

            <p id="rush-feedback" class="rush-feedback" role="status"></p>
        </main>
    </div>

    <!-- Game Over Summary Modal -->
    <div id="rush-summary-modal" class="modal-overlay" hidden role="dialog" aria-modal="true">
        <div class="summary-card">
            <h2>⚡ Rush Complete!</h2>
            <p style="color: var(--text-muted); margin: 0;">Puzzles Solved</p>
            <div class="summary-score" id="summary-score-val">0</div>
            <div id="summary-high-badge" class="high-score-badge" hidden>🏆 New High Score!</div>

            <div class="modal-actions">
                <button id="btn-play-again" class="btn-modal btn-retry">Play Again</button>
                <a href="arena.html" class="btn-modal btn-arena">Back to Arena</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/dev-reload.js"></script>
    <script src="js/rush.js"></script>
</body>
</html>
