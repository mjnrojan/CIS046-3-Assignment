<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboards – Banana Puzzle Arena</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #161512;
            color: #bababa;
            margin: 0;
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .leaderboard-container {
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Top Bar */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #262421;
            border: 1px solid #36322d;
            border-radius: 10px;
            padding: 0.85rem 1.25rem;
        }

        .nav-link {
            color: #81b64c;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .nav-link:hover {
            text-decoration: underline;
        }

        .page-title {
            color: #ffffff;
            font-weight: 800;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Mode Switcher Tabs */
        .mode-tabs {
            display: flex;
            background: #262421;
            border: 1px solid #36322d;
            border-radius: 10px;
            padding: 0.35rem;
            gap: 0.5rem;
        }

        .tab-btn {
            flex: 1;
            padding: 0.75rem 0.5rem;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: #bababa;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
        }

        .tab-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.04);
        }

        .tab-btn.active {
            background: #81b64c;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(129, 182, 76, 0.3);
        }

        /* Personal Standing Sticky Card */
        .user-standing-card {
            background: linear-gradient(135deg, #1b2614, #262421);
            border: 1px solid #81b64c;
            border-radius: 10px;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .standing-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .standing-badge {
            background: #81b64c;
            color: #ffffff;
            font-weight: 900;
            padding: 0.3rem 0.7rem;
            border-radius: 6px;
            font-size: 1rem;
        }

        .standing-name {
            color: #ffffff;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .standing-score {
            font-size: 1.4rem;
            font-weight: 900;
            color: #81b64c;
        }

        /* Leaderboard Table Card */
        .table-card {
            background: #262421;
            border: 1px solid #36322d;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .leaderboard-table th {
            background: #1b1917;
            color: #888888;
            padding: 0.9rem 1.25rem;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #36322d;
        }

        .leaderboard-table td {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid #2d2b27;
            font-size: 1rem;
        }

        .leaderboard-table tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .leaderboard-table tr.is-self {
            background: rgba(129, 182, 76, 0.12);
            font-weight: 700;
        }

        .leaderboard-table tr.is-self td {
            border-bottom-color: rgba(129, 182, 76, 0.3);
        }

        .rank-cell {
            width: 60px;
            font-weight: 800;
            font-size: 1.1rem;
        }

        .medal-1 { color: #ffd700; font-size: 1.25rem; }
        .medal-2 { color: #c0c0c0; font-size: 1.25rem; }
        .medal-3 { color: #cd7f32; font-size: 1.25rem; }

        .player-cell {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: #ffffff;
        }

        .you-badge {
            background: #81b64c;
            color: #ffffff;
            font-size: 0.7rem;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .score-cell {
            text-align: right;
            font-weight: 800;
            color: #81b64c;
            font-size: 1.15rem;
            font-family: monospace;
        }

        .empty-row {
            text-align: center;
            color: #777777;
            padding: 3rem 1rem !important;
        }
    </style>
</head>
<body>
    <div class="leaderboard-container">
        <!-- Top Navigation -->
        <header class="top-nav">
            <a href="arena.html" class="nav-link">← Return to Arena</a>
            <div class="page-title">🏆 Arena Leaderboards</div>
            <a href="arena.html" class="nav-link">Play Modes →</a>
        </header>

        <!-- Mode Selection Tabs -->
        <nav class="mode-tabs" role="tablist">
            <button id="tab-rush" class="tab-btn active" role="tab" data-mode="rush">⚡ Puzzle Rush</button>
            <button id="tab-battle" class="tab-btn" role="tab" data-mode="battle">⚔️ Puzzle Battle</button>
            <button id="tab-ladder" class="tab-btn" role="tab" data-mode="ladder">🪜 Classic Ladder</button>
        </nav>

        <!-- Current Player Standing Card -->
        <div id="user-standing-card" class="user-standing-card" hidden>
            <div class="standing-info">
                <span id="standing-rank" class="standing-badge">#--</span>
                <div>
                    <div id="standing-username" class="standing-name">You</div>
                    <div id="standing-metric-desc" style="font-size: 0.85rem; color: #bababa;">Your Best</div>
                </div>
            </div>
            <div id="standing-score" class="standing-score">--</div>
        </div>

        <!-- Leaderboard Table Card -->
        <main class="table-card">
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th style="width: 70px;">Rank</th>
                        <th>Player</th>
                        <th id="metric-header" style="text-align: right;">Top Solves</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <tr>
                        <td colspan="3" class="empty-row">Loading rankings...</td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>

    <script src="js/leaderboard.js"></script>
    <script src="js/dev-reload.js"></script>
</body>
</html>
